  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

l>\n          <input type=\"email\" id=\"lg-mail\" inputmode=\"email\" autocomplete=\"email\" sc-camel-on-key-down=\"{{ onKey }}\" placeholder=\"{{ exemploEmail }}\" style=\"width:100%;padding:9px 12px;border:1px solid #c7d7f7;border-radius:8px;font-size:0.88rem;background:#fafbff;outline:none;margin-bottom:6px\">\n          <div style=\"font-size:0.72rem;color:#94a3b8;margin-bottom:14px;line-height:1.4\">Você receberá um link de acesso nesse endereço. Não há senha para criar.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ enviarLink }}\" style=\"width:100%;background:#2563a8;color:#fff;border:none;border-radius:8px;padding:11px;font-size:0.88rem;font-weight:700;cursor:pointer\">{{ botaoLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"display:{{ enviadoShow }};text-align:center\">\n          <div style=\"font-size:2rem;margin-bottom:8px\">✉️<\u002Fdiv>\n          <div style=\"font-size:0.9rem;font-weight:700;color:#1a3a6b;margin-bottom:6px\">Link enviado<\u002Fdiv>\n          <div style=\"font-size:0.82rem;color:#555;line-height:1.5\">Abra o e-mail que acabamos de mandar para <strong>{{ emailEnviado }}<\u002Fstrong> e clique no link. Ele vale por uma hora.<\u002Fdiv>\n          <div style=\"font-size:0.75rem;color:#94a3b8;margin-top:10px;line-height:1.4\">Não chegou? Confira a caixa de spam ou lixo eletrônico.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ voltar }}\" style=\"margin-top:16px;background:none;border:none;color:#2563a8;font-size:0.78rem;font-weight:700;cursor:pointer;text-decoration:underline\">Usar outro e-mail<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"display:{{ erroShow }};margin-top:11px;font-size:0.79rem;color:#dc2626;font-weight:600;text-align:center\">{{ erro }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showPortal }}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n      <div style=\"background:linear-gradient(135deg,#1a3a6b 0%,#2563a8 100%);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap\">\n        <div>\n          <div style=\"font-size:1.02rem;font-weight:700\">{{ nome }}<\u002Fdiv>\n          <div style=\"font-size:0.75rem;opacity:0.85;margin-top:2px\">{{ identidade }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ sair }}\" style=\"background:rgba(255,255,255,0.18);color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:0.76rem;font-weight:700;cursor:pointer\">Sair<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"max-width:760px;margin:0 auto;padding:16px 14px 40px\">\n\n        <div style=\"display:{{ vazioShow }};background:#fff;border-radius:10px;padding:26px 20px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,0.07)\">\n          <div style=\"font-size:0.92rem;font-weight:700;color:#1a3a6b;margin-bottom:6px\">{{ vazioTitulo }}<\u002Fdiv>\n          <div style=\"font-size:0.83rem;color:#666;line-height:1.5\">{{ vazioTexto }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:{{ dadosShow }}\">\n          <div style=\"font-size:0.7rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px\">Notas e faltas por rota<\u002Fdiv>\n          <sc-for list=\"{{ blocos }}\" as=\"g\" hint-placeholder-count=\"2\">\n            <div style=\"border-radius:10px;padding:12px;margin-bottom:8px;background:{{ g.bg }};border:2px solid {{ g.border }}\">\n              <div style=\"font-size:0.82rem;font-weight:800;color:#1a3a6b;margin-bottom:10px\">{{ g.titulo }}<span style=\"display:{{ g.ativoShow }};background:#16a34a;color:#fff;font-size:0.68rem;padding:1px 7px;border-radius:9px;margin-left:7px;vertical-align:middle\">EM CURSO<\u002Fspan><span style=\"font-weight:600;color:#94a3b8;font-size:0.72rem;margin-left:7px\">{{ g.periodo }}<\u002Fspan><\u002Fdiv>\n              <sc-for list=\"{{ g.discs }}\" as=\"d\" hint-placeholder-count=\"1\">\n                <div style=\"margin-bottom:10px\">\n                  <div style=\"display:{{ d.chipShow }};margin-bottom:6px\"><span style=\"background:#e0e7ff;color:#3730a3;padding:1px 7px;border-radius:8px;font-size:0.73rem;font-weight:700\">{{ d.nome }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:7px\">\n                    <div style=\"border-radius:9px;padding:6px 13px;background:{{ d.nfBg }};border:1.5px solid {{ d.nfBorder }}\">\n                      <div style=\"font-size:0.62rem;font-weight:800;color:#64748b;letter-spacing:0.4px\">NOTA FINAL<\u002Fdiv>\n                      <div style=\"font-size:1.25rem;font-weight:800;line-height:1.1;color:{{ d.nfFg }}\">{{ d.nf }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                      <sc-for list=\"{{ d.metrics }}\" as=\"m\" hint-placeholder-count=\"3\">\n                        <div style=\"background:#fff;border:1px solid #e8eaf0;border-radius:8px;padding:5px 9px\">\n                          <div style=\"font-size:0.58rem;font-weight:800;color:#94a3b8;letter-spacing:0.4px\">{{ m.label }}<\u002Fdiv>\n                          <div style=\"font-size:0.88rem;font-weight:700;color:{{ m.fg }}\">{{ m.valor }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:{{ d.simsShow }};margin-bottom:6px\">\n                    <span style=\"font-size:0.65rem;color:#94a3b8;font-weight:700\">SIMULADOS: <\u002Fspan>\n                    <sc-for list=\"{{ d.sims }}\" as=\"x\" hint-placeholder-count=\"3\">\n                      <span style=\"padding:2px 7px;border-radius:8px;font-size:0.75rem;margin-right:3px;background:{{ x.bg }};color:{{ x.fg }}\">{{ x.label }}<\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"font-size:0.72rem;padding-top:4px;border-top:1px solid #e8eaf0;font-weight:700;color:{{ d.faltaColor }}\">{{ d.faltaTxt }}<\u002Fdiv>\n                  <div style=\"display:{{ d.faltaDiasShow }};gap:4px;flex-wrap:wrap;margin-top:5px\">\n                    <sc-for list=\"{{ d.faltaDias }}\" as=\"x\" hint-placeholder-count=\"2\">\n                      <span style=\"padding:2px 8px;border-radius:8px;font-size:0.7rem;font-weight:600;background:{{ x.bg }};color:{{ x.fg }}\">{{ x.label }}<\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"display:{{ chartShow }};background:#fff;border-radius:10px;padding:14px;margin-top:12px;box-shadow:0 1px 4px rgba(0,0,0,0.07)\">\n            <div style=\"font-size:0.78rem;font-weight:700;color:#4b5563;margin-bottom:4px\">📉 Evolução dos simulados<\u002Fdiv>\n            <svg sc-camel-view-box=\"0 0 480 180\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;border-radius:8px;background:#f8fafc\">\n              <sc-for list=\"{{ chartGrid }}\" as=\"l\" hint-placeholder-count=\"3\">\n                <line x1=\"32\" y1=\"{{ l.y }}\" x2=\"468\" y2=\"{{ l.y }}\" stroke=\"{{ l.cor }}\" stroke-dasharray=\"4,3\" stroke-width=\"1.3\"><\u002Fline>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ chartGrid }}\" as=\"l\" hint-placeholder-count=\"3\">\n                <text x=\"29\" y=\"{{ l.ty }}\" text-anchor=\"end\" font-size=\"9\" fill=\"#94a3b8\">{{ l.label }}<\u002Ftext>\n              <\u002Fsc-for>\n              <path d=\"{{ chartPath }}\" fill=\"none\" stroke=\"#818cf8\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpath>\n              <sc-for list=\"{{ chartPontos }}\" as=\"p\" hint-placeholder-count=\"4\">\n                <circle cx=\"{{ p.cx }}\" cy=\"{{ p.cy }}\" r=\"5.5\" fill=\"{{ p.fill }}\" stroke=\"#fff\" stroke-width=\"2\"><\u002Fcircle>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ chartPontos }}\" as=\"p\" hint-placeholder-count=\"4\">\n                <text x=\"{{ p.cx }}\" y=\"{{ p.ty }}\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1e293b\" font-weight=\"700\">{{ p.valor }}<\u002Ftext>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ chartPontos }}\" as=\"p\" hint-placeholder-count=\"4\">\n                <text x=\"{{ p.cx }}\" y=\"172\" text-anchor=\"middle\" font-size=\"8\" fill=\"#94a3b8\">{{ p.label }}<\u002Ftext>\n              <\u002Fsc-for>\n            <\u002Fsvg>\n            <div style=\"font-size:0.68rem;color:#94a3b8;margin-top:4px\">● verde ≥ 6,0 · ● vermelho &lt; 6,0 · linha amarela = 6,0 · linha verde = 7,0<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"font-size:0.7rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin:18px 0 8px\">Sua trilha no semestre<\u002Fdiv>\n          <sc-for list=\"{{ trilha }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <div style=\"border-radius:7px;margin-bottom:5px;padding:9px 11px;display:flex;align-items:flex-start;gap:9px;background:{{ t.bg }};border:{{ t.border }}\">\n              <span style=\"font-size:0.68rem;font-weight:800;padding:2px 7px;border-radius:10px;flex-shrink:0;margin-top:2px;background:{{ t.tagBg }};color:{{ t.tagFg }}\">{{ t.rota }}<\u002Fspan>\n              <div style=\"flex:1\">\n                <div style=\"font-size:0.82rem;font-weight:700;color:#1a1a2e\">{{ t.disc }}<span style=\"display:{{ t.atualShow }};background:#2563a8;color:#fff;font-size:0.65rem;font-weight:800;padding:1px 6px;border-radius:8px;margin-left:6px;vertical-align:middle\">ATUAL<\u002Fspan><\u002Fdiv>\n                <div style=\"font-size:0.77rem;color:#2563a8;margin-top:2px\">{{ t.unit }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:0.72rem;color:#888;white-space:nowrap;text-align:right;flex-shrink:0\">{{ t.periodo }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"display:{{ provasShow }}\">\n            <div style=\"font-size:0.7rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin:18px 0 8px\">Próximas provas<\u002Fdiv>\n            <div style=\"background:#fff;border-radius:10px;padding:6px 0;box-shadow:0 1px 4px rgba(0,0,0,0.07)\">\n              <sc-for list=\"{{ provas }}\" as=\"p\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex;align-items:center;gap:11px;padding:9px 14px;border-bottom:1px solid #f0f0f5\">\n                  <div style=\"text-align:center;min-width:38px\">\n                    <div style=\"font-size:1.05rem;font-weight:800;color:#1a3a6b;line-height:1.1\">{{ p.dia }}<\u002Fdiv>\n                    <div style=\"font-size:0.63rem;color:#94a3b8;text-transform:uppercase\">{{ p.mes }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:1\">\n                    <div style=\"font-size:0.83rem;font-weight:700\">{{ p.nome }}<\u002Fdiv>\n                    <div style=\"font-size:0.72rem;color:#888;margin-top:1px\">{{ p.local }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"font-size:0.7rem;color:#aaa;text-align:center;margin-top:20px\">{{ publicadoEm }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  \n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { fase: 'checking', checkingMsg: 'Carregando…', erro: '', busy: false, enviado: '', dados: null, email: '' };\n\n  DOMINIO = '@uni9.edu.br';\n  CHAVE_MAIL = 'portal_email_262';\n  MN = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];\n\n  /* Demonstração: abra o portal com ?demo no fim do endereço para ver o layout com dados fictícios. */\n  exemplo() {\n    const chip = (v, bg, fg) => ({ label: v, bg: bg, fg: fg });\n    const met = (l, v, bg, fg) => ({ label: l, valor: v, bg: bg, fg: fg });\n    return {\n      nome: 'Maria Exemplo de Souza', ra: '1234567', turma: 'T6B', email: 'exemplo' + this.DOMINIO,\n      blocos: [\n        {\n          titulo: 'R1 — Clínica Médica 1', periodo: '04/08 - 12/09', ativoShow: 'none',\n          bg: '#f7f9ff', border: '#dbeafe',\n          discs: [{\n            nome: 'Clínica Médica 1', chipShow: 'none', nf: '7,8', nfBg: '#dcfce7', nfFg: '#16a34a', nfBorder: '#16a34a33',\n            metrics: [met('NOTA ROTA', '8,0', '#dcfce7', '#16a34a'), met('NOTA SUPERVISOR', '7,5', '#dcfce7', '#16a34a'), met('MAIOR SIMULADO', '7,8', '#dcfce7', '#16a34a')],\n            simsShow: 'block',\n            sims: [chip('S1: 6,4', '#f3f4f6', '#334155'), chip('S2: 7,8', '#f3f4f6', '#334155')],\n            faltaTxt: '✅ 0h de falta', faltaColor: '#059669', faltaDiasShow: 'none', faltaDias: []\n          }]\n        },\n        {\n          titulo: 'R2 — Medicina de Família 2 + Saúde Coletiva', periodo: '15/09 - 24/10', ativoShow: 'inline',\n          bg: '#f0fdf4', border: '#4ade80',\n          discs: [\n            {\n              nome: 'Medicina de Família 2', chipShow: 'block', nf: '6,2', nfBg: '#dbeafe', nfFg: '#1d4ed8', nfBorder: '#1d4ed833',\n              metrics: [met('NOTA ROTA', '7,0', '#dcfce7', '#16a34a'), met('NOTA SUPERVISOR', '6,5', '#dbeafe', '#1d4ed8'), met('MAIOR SIMULADO', '—', '#f1f5f9', '#94a3b8')],\n              simsShow: 'none', sims: [],\n              faltaTxt: '⚠️ 4h de falta', faltaColor: '#0369a1',\n              faltaDiasShow: 'flex',\n              faltaDias: [{ label: '22/09 Seg · 4h (meio turno)', bg: '#fef9c3', fg: '#a16207' }]\n            },\n            {\n              nome: 'Saúde Coletiva', chipShow: 'block', nf: '—', nfBg: '#f1f5f9', nfFg: '#94a3b8', nfBorder: '#94a3b833',\n              metrics: [met('NOTA ROTA', '—', '#f1f5f9', '#94a3b8'), met('NOTA SUPERVISOR', '—', '#f1f5f9', '#94a3b8'), met('MAIOR SIMULADO', '—', '#f1f5f9', '#94a3b8')],\n              simsShow: 'none', sims: [],\n              faltaTxt: 'faltas: —', faltaColor: '#bbb', faltaDiasShow: 'none', faltaDias: []\n            }\n          ]\n        }\n      ],\n      chart: {\n        show: true,\n        grid: [{ y: 100.1, cor: '#fca5a5', label: '5', ty: 103.6 }, { y: 84.4, cor: '#fbbf24', label: '6', ty: 87.9 }, { y: 68.7, cor: '#86efac', label: '7', ty: 72.2 }],\n        path: 'M32,122.4 L177.3,89.1 L322.7,72.6 L468,60.1',\n        pontos: [\n          { cx: 32, cy: 122.4, fill: '#dc2626', valor: '3,9', ty: 113.4, label: 'R1·S1' },\n          { cx: 177.3, cy: 89.1, fill: '#dc2626', valor: '5,8', ty: 80.1, label: 'R1·S2' },\n          { cx: 322.7, cy: 72.6, fill: '#16a34a', valor: '6,8', ty: 63.6, label: 'R2·S1' },\n          { cx: 468, cy: 60.1, fill: '#16a34a', valor: '7,6', ty: 51.1, label: 'R2·S2' }\n        ]\n      },\n      trilha: [\n        { rota: 'R1', disc: 'Clínica Médica 1', unit: 'Hospital Municipal Vila Santa Catarina', periodo: '04/08 - 12/09', atual: false },\n        { rota: 'R2', disc: 'Medicina de Família 2', unit: 'UBS Jardim São Luís', periodo: '15/09 - 24/10', atual: true },\n        { rota: 'R2', disc: 'Saúde Coletiva', unit: 'UBS Jardim São Luís', periodo: '15/09 - 24/10', atual: true },\n        { rota: 'R3', disc: 'Pediatria 1', unit: 'Hospital Geral do Grajaú', periodo: '27/10 - 05/12', atual: false }\n      ],\n      provas: [\n        { nome: 'Simulado 3 — Clínica e MFC', data: '2026-10-08', local: 'Campus Memorial · Sala 402', turma: 'T6B' },\n        { nome: 'Prova de Saúde Coletiva', data: '2026-10-22', local: 'Campus Vergueiro', turma: 'T6B' }\n      ],\n      pub: Date.now()\n    };\n  }\n\n  async componentDidMount() {\n    if (this.props.demo || /[?&]demo/.test(location.search)) {\n      this.setState({ fase: 'portal', email: 'exemplo' + this.DOMINIO, dados: this.exemplo(), demo: true });\n      return;\n    }\n    const pronto = () => !!(window.firebase && window.firebase.initializeApp && window.FB_CONFIG && window.FB_CONFIG.apiKey);\n    for (let i = 0; i < 120 && !pronto(); i++) await new Promise(r => setTimeout(r, 50));\n    if (!pronto()) { this.setState({ fase: 'login', erro: 'Portal ainda não configurado. Procure a coordenação.' }); return; }\n    try {\n      if (!firebase.apps.length) firebase.initializeApp(window.FB_CONFIG);\n      this.db = firebase.firestore();\n      this.auth = firebase.auth();\n      await this.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);\n    } catch (e) { this.setState({ fase: 'login', erro: 'Falha ao iniciar: ' + e.message }); return; }\n\n    if (this.auth.isSignInWithEmailLink(location.href)) {\n      this.setState({ checkingMsg: 'Validando seu link…' });\n      let mail = '';\n      try { mail = localStorage.getItem(this.CHAVE_MAIL) || ''; } catch (e) { }\n      if (!mail) mail = (window.prompt('Confirme seu e-mail institucional para concluir o acesso:') || '').trim();\n      try {\n        await this.auth.signInWithEmailLink(mail.toLowerCase(), location.href);\n        try { localStorage.removeItem(this.CHAVE_MAIL); } catch (e) { }\n        history.replaceState(null, '', location.pathname);\n      } catch (e) {\n        this.setState({ fase: 'login', erro: this.msg(e) });\n      }\n    }\n\n    this.auth.onAuthStateChanged(u => {\n      if (!u) { this.parar(); this.setState({ fase: 'login', dados: null, email: '' }); return; }\n      if (!this.conferirValidade()) return;\n      const mail = (u.email || '').toLowerCase();\n      this.setState({ fase: 'portal', email: mail, erro: '', busy: false });\n      this.vigiarOcio();\n      this.ouvir(mail);\n    });\n  }\n\n  /* Sessão expira sozinha: protege o aluno que esquece o portal aberto num computador compartilhado. */\n  OCIOSO_MS = 20 * 60 * 1000;\n  VALIDADE_MS = 30 * 24 * 60 * 60 * 1000;\n  CHAVE_INICIO = 'portal_inicio_262';\n\n  vigiarOcio() {\n    if (this._vig) return;\n    this._vig = true;\n    const reiniciar = () => {\n      clearTimeout(this._tOcio);\n      this._tOcio = setTimeout(() => this.expirar('Sessão encerrada por inatividade. Peça um novo link para entrar.'), this.OCIOSO_MS);\n    };\n    ['pointerdown', 'keydown', 'touchstart', 'focus'].forEach(ev => window.addEventListener(ev, reiniciar, true));\n    document.addEventListener('visibilitychange', () => { if (!document.hidden) reiniciar(); });\n    this._reiniciar = reiniciar;\n    reiniciar();\n  }\n\n  expirar(msg) {\n    clearTimeout(this._tOcio);\n    this.parar();\n    try { localStorage.removeItem(this.CHAVE_INICIO); } catch (e) { }\n    if (this.auth) this.auth.signOut();\n    this.setState({ fase: 'login', dados: null, enviado: '', erro: msg });\n  }\n\n  conferirValidade() {\n    let inicio = 0;\n    try { inicio = parseInt(localStorage.getItem(this.CHAVE_INICIO) || '0', 10); } catch (e) { }\n    if (!inicio) { try { localStorage.setItem(this.CHAVE_INICIO, String(Date.now())); } catch (e) { } return true; }\n    if (Date.now() - inicio > this.VALIDADE_MS) {\n      this.expirar('Seu acesso completou 30 dias. Peça um novo link para continuar.');\n      return false;\n    }\n    return true;\n  }\n\n  componentWillUnmount() { this.parar(); clearTimeout(this._tOcio); }\n  parar() { if (this._un) { try { this._un(); } catch (e) { } this._un = null; } }\n\n  /* A regra do servidor só devolve o documento cujo campo email bate com o de quem entrou. */\n  ouvir(mail) {\n    this.parar();\n    this._un = this.db.collection('alunos').where('email', '==', mail).limit(1).onSnapshot(\n      snap => this.setState({ dados: snap.empty ? null : snap.docs[0].data(), leituraNegada: false }),\n      e => this.setState({ dados: null, leituraNegada: e && e.code === 'permission-denied' }));\n  }\n\n  val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }\n\n  enviarLink = () => {\n    if (!th ring(dt.getDate()), mes: this.MN[dt.getMonth()] || '', nome: p.nome, local: p.local || '' };\n      }),\n      publicadoEm: s.demo\n        ? 'Demonstração com dados fictícios'\n        : (d && d.pub ? ('Notas publicadas em ' + new Date(d.pub).toLocaleDateString('pt-BR')) : '')\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
